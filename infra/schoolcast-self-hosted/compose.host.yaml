name: jinacampus-schoolcast-${SCHOOLCAST_WORKER_REPLICA_ID:?Set SCHOOLCAST_WORKER_REPLICA_ID}

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: 10m
    max-file: "5"
    compress: "true"

services:
  worker:
    image: jinacampus-schoolcast-worker:${SCHOOLCAST_WORKER_IMAGE_TAG:-staging}
    build:
      context: ../..
      dockerfile: Dockerfile.schoolcast-worker
    env_file:
      - path: ${SCHOOLCAST_WORKER_ENV_FILE:-./worker.env.local}
        required: true
    environment:
      NODE_ENV: production
      SCHOOLCAST_WORKER_ENABLED: "true"
      SCHOOLCAST_WORKER_DEPLOYMENT_ENVIRONMENT: STAGING
      SCHOOLCAST_WORKER_RUN_MODE: CONTINUOUS
      SCHOOLCAST_WORKER_REPLICA_ID: ${SCHOOLCAST_WORKER_REPLICA_ID:?Set SCHOOLCAST_WORKER_REPLICA_ID}
      SCHOOLCAST_WORKER_HEALTH_PORT: "9464"
      SCHOOLCAST_MALWARE_SCANNER_MODE: CLAMAV
      SCHOOLCAST_CLAMAV_HOST: clamav
      SCHOOLCAST_CLAMAV_PORT: "3310"
    depends_on:
      clamav:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SCHOOLCAST_PRIVATE_BIND_ADDRESS:?Set private bind address}:9464:9464"
    networks:
      - service-egress
      - observability
    logging: *bounded-logs

  clamav:
    image: clamav/clamav@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    restart: unless-stopped
    volumes:
      - clamav-database:/var/lib/clamav
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run/clamav:size=16m,mode=0755
      - /var/log/clamav:size=32m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3 --wait=5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    networks:
      - service-egress
      - observability
    logging: *bounded-logs

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.advertise-address=${SCHOOLCAST_PRIVATE_BIND_ADDRESS:?Set private bind address}:9094
      - --cluster.peer=${SCHOOLCAST_ALERTMANAGER_PEER_TARGET:?Set peer Alertmanager target}
    volumes:
      - ${SCHOOLCAST_ALERTMANAGER_CONFIG_FILE:-./generated/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SCHOOLCAST_PRIVATE_BIND_ADDRESS:?Set private bind address}:9093:9093"
      - "${SCHOOLCAST_PRIVATE_BIND_ADDRESS:?Set private bind address}:9094:9094/tcp"
      - "${SCHOOLCAST_PRIVATE_BIND_ADDRESS:?Set private bind address}:9094:9094/udp"
    networks:
      - service-egress
      - observability
    logging: *bounded-logs

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ${SCHOOLCAST_PROMETHEUS_CONFIG_FILE:?Render the distributed Prometheus config first}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/schoolcast.rules.yml:/etc/prometheus/schoolcast.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - worker
      - alertmanager
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${SCHOOLCAST_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - service-egress
      - observability
    logging: *bounded-logs

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${SCHOOLCAST_GRAFANA_ADMIN_USER:-schoolcast-ops}
      GF_SECURITY_ADMIN_PASSWORD: ${SCHOOLCAST_GRAFANA_ADMIN_PASSWORD:?Set SCHOOLCAST_GRAFANA_ADMIN_PASSWORD outside Git}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${SCHOOLCAST_GRAFANA_COOKIE_SECURE:-false}
      GF_SERVER_ROOT_URL: ${SCHOOLCAST_GRAFANA_ROOT_URL:-http://localhost:3300}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${SCHOOLCAST_GRAFANA_PORT:-3300}:3000"
    networks:
      - observability
    logging: *bounded-logs

networks:
  service-egress:
    driver: bridge
  observability:
    driver: bridge
    internal: true

volumes:
  alertmanager-data:
  clamav-database:
  grafana-data:
  prometheus-data:
