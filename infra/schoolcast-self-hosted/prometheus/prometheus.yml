global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/schoolcast.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: schoolcast-workers
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - worker-a:9464
          - worker-b:9464
