groups:
  - name: schoolcast-worker
    rules:
      - alert: SchoolCastWorkerMetricsMissing
        expr: absent(up{job="schoolcast-workers"})
        for: 1m
        labels:
          severity: sev2
        annotations:
          summary: SchoolCast worker metrics are missing
          description: No SchoolCast worker scrape target is visible.

      - alert: SchoolCastBothWorkerReplicasUnavailable
        expr: sum(up{job="schoolcast-workers"}) == 0
        for: 1m
        labels:
          severity: sev2
        annotations:
          summary: Both SchoolCast worker replicas are unavailable
          description: Stop live delivery escalation and restore worker capacity.

      - alert: SchoolCastWorkerReplicaMissing
        expr: count(up{job="schoolcast-workers"}) < 2 or sum(up{job="schoolcast-workers"}) < 2
        for: 2m
        labels:
          severity: sev2
        annotations:
          summary: Fewer than two SchoolCast worker replicas are healthy
          description: The approved worker redundancy target is not being met.

      - alert: SchoolCastWorkerHeartbeatStale
        expr: min(schoolcast_worker_live) == 0
        for: 1m
        labels:
          severity: sev2
        annotations:
          summary: A SchoolCast worker heartbeat is stale
          description: A worker cycle may be blocked or its process may be shutting down.

      - alert: SchoolCastExternalHeartbeatMissing
        expr: min(schoolcast_worker_external_heartbeat_configured) < 1
        for: 1m
        labels:
          severity: sev2
        annotations:
          summary: External SchoolCast heartbeat is not configured
          description: This replica cannot be observed when both worker hosts are unreachable.

      - alert: SchoolCastExternalHeartbeatDeliveryFailed
        expr: increase(schoolcast_worker_external_heartbeat_deliveries_total{result="failure"}[5m]) > 0
        for: 1m
        labels:
          severity: sev2
        annotations:
          summary: External SchoolCast heartbeat delivery failed
          description: Verify the independent monitor path without logging or exposing its check URL.

      - alert: SchoolCastQueueAgeHigh
        expr: max(schoolcast_worker_queue_oldest_age_seconds) >= 600
        for: 2m
        labels:
          severity: sev2
        annotations:
          summary: SchoolCast due work is at least ten minutes old
          description: Investigate workers, database capacity, scanner, and provider health.

      - alert: SchoolCastQueueDepthHigh
        expr: max(schoolcast_worker_queue_depth) >= 500
        for: 5m
        labels:
          severity: sev2
        annotations:
          summary: SchoolCast queue depth exceeded the approved threshold
          description: Capacity or a downstream dependency may be degraded.

      - alert: SchoolCastDeadLetterPresent
        expr: max(schoolcast_worker_queue_items{state=~"failed|undeliverable"}) > 0
        for: 1m
        labels:
          severity: sev3
        annotations:
          summary: SchoolCast terminal work requires audited reconciliation
          description: Resolve the cause before using permission-scoped requeue controls.

      - alert: SchoolCastScannerUnavailableWithBacklog
        expr: max(schoolcast_worker_queue_items{queue="attachments",state="pending"}) > 0 and min(schoolcast_worker_scanner_ready) == 0
        for: 2m
        labels:
          severity: sev2
        annotations:
          summary: SchoolCast attachment scanning is unavailable with queued files
          description: Attachments remain quarantined; restore the private scanner.

      - alert: SchoolCastWorkerCycleErrors
        expr: max(schoolcast_worker_errors) > 0
        for: 2m
        labels:
          severity: sev2
        annotations:
          summary: SchoolCast worker cycles are reporting processing errors
          description: Inspect safe structured worker logs and queue ledgers.
