global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor_replica: __MONITOR_REPLICA__

rule_files:
  - /etc/prometheus/schoolcast.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - __ALERTMANAGER_A_TARGET__
            - __ALERTMANAGER_B_TARGET__

scrape_configs:
  - job_name: schoolcast-workers
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - __WORKER_A_TARGET__
          - __WORKER_B_TARGET__
