global:
  resolve_timeout: 5m

route:
  receiver: schoolcast-operations
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: schoolcast-operations
    webhook_configs:
      - url: __PRIMARY_WEBHOOK_URL__
        send_resolved: true
      - url: __BACKUP_WEBHOOK_URL__
        send_resolved: true
